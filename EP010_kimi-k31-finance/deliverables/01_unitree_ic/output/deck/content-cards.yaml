meta:
  tone: IC
  deck: 宇树科技投资价值投委会
  pages: 25
pages:
  - page: 2
    message: 现价缺乏常规仓位安全边际
    title: 667 元股价对应约 482x TTM PE，现阶段建议不建仓并等待商业验证
    subtitle: 好公司与好价格分开表决，先验证重复订单、扣非利润和现金流，再讨论平台溢价
    exhibits: [投决建议卡, 三项多头证据, 三项空头证据, 复议条件]
    insight:
      - 2025 年人形出货 5511 台、收入 16.99 亿元，量产与商业化已具备事实基础
      - 2026 年前三季度扣非净利润下降 18.8%，当前盈利方向与收入增速背离
      - 建议不建新仓并进入高优先观察池，避免用远期叙事替代当期风险预算
    footnotes: 行情为 2026-10-30 盘中快照；建议仅用于内部投委会讨论
    source: 公司三季报；Wind；团队分析
  - page: 3
    message: 市场定价已非常充分
    title: 2,698 亿元市值已计入强光平台预期，三项条件决定可否重估
    subtitle: 当前估值同时要求业绩高速增长、远期高倍数延续和稀缺性溢价不被稀释
    exhibits: [价格与市值 KPI, TTM 与 FY2026 PE, 自由流通盘, 三项复议条件]
    insight:
      - 667.10 元对应盘中总市值约 2698 亿元、TTM PE 482x
      - 同花顺 6 家 FY2026 EPS 共识 1.68 元，对应 FY2026 PE 约 397x
      - 自由流通股约 3009 万股、约占总股本 7.4%，价格波动与稀缺性溢价相互放大
    footnotes: FY2026 PE 为盘中价除以共识 EPS；自由流通比例按最新披露口径估算
    source: Wind；同花顺共识；公司三季报
  - page: 4
    message: 分歧集中在平台价值能否兑现
    title: 市场把 4 项先发优势外推为平台溢价，我们用 6 个序列检验兑现
    subtitle: 不否认量产和运控领先，争议在于这些优势能否转成可持续企业订单与现金回报
    exhibits: [共识对照表, 内部判断, 六个裁决序列]
    insight:
      - 出货领先可被验证，科研采购主导的收入结构仍需向重复企业订单迁移
      - 物理 AI 大会改变预期不等同于改变订单，模型演示需转成现场可靠性指标
      - 稀缺性可支撑溢价但无法提供估值底，业绩与流通盘变化会重设价格锚
    footnotes: 内部判断不代表公司指引；裁决序列按季度复核
    source: 公司披露；4 家机构研报；团队分析
  - page: 6
    message: 当前价值主要来自硬件整机
    title: 人形与四足贡献 93.4% 主营收入，硬件整机决定当前价值
    subtitle: 人形完成收入主引擎切换，四足提供规模基础，组件与模型尚未形成独立收入支柱
    exhibits: [产品矩阵, 2025 分产品收入, 分产品毛利率]
    insight:
      - 人形收入 8.68 亿元、占主营 51.78%，四足收入 6.98 亿元、占 41.62%
      - 人形与四足毛利率分别为 63.18% 和 56.72%，硬件盈利已得到报表验证
      - 组件收入 1.04 亿元、占 6.19%，模型与生态价值仍主要通过整机销售体现
    footnotes: 分产品占比为主营业务口径，与营业总收入口径略有差异
    source: 招股说明书上会稿
  - page: 7
    message: 四足积累缩短人形工程化路径
    title: 10 年运控积累压缩至 3 年人形放量，工程复用是核心路径
    subtitle: 关节、电驱、控制算法与供应链在四足和人形之间复用，缩短产品验证与降本周期
    exhibits: [发展时间轴, 技术复用链, 产品节奏]
    insight:
      - 2016 年公司成立，2017 年首款商用四足交付，先完成硬件与运控验证
      - 2023 年 H1 发布，2024 年 G1 进入十万元以内，人形开始规模销售
      - 2025—2026 年模型与算力投入增加，竞争焦点由运动能力扩展到任务执行
    footnotes: 10 年为公司成立至 2026 年的近似时间跨度
    source: 招股说明书；东吴证券；太平洋证券
  - page: 8
    message: 行业空间大但预测口径分散
    title: 2026E 全球人形出货或达 8.17 万台，高增长仍依赖低基数
    subtitle: 行业处于样机向批量交付过渡期，出货基数、产品定义和预测机构差异会显著放大远期空间
    exhibits: [2024—2026E 出货柱图, 2030E 市场卡, 预测口径对照]
    insight:
      - Yano Research 口径全球出货由 2024 年约 0.26 万台升至 2025 年约 1.66 万台
      - 2026E 约 8.17 万台是第三方预测，不应与公司订单或确认收入混用
      - GGII 预计 2030 年销量 60.57 万台、市场约 1022 亿元，远期假设需逐年复核
    footnotes: 2026E 与 2030E 均为第三方预测；不同机构统计口径并不一致
    source: 东吴证券；华金证券；Yano Research；GGII
  - page: 9
    message: 领先份额尚未等于稳定格局
    title: 2025 年宇树以 37.5% 份额居首，但前两名合计已达 72.8%
    subtitle: 宇树与智元形成第一梯队，后续排名取决于工业订单、价格带与真实交付而非单次出货
    exhibits: [2025 出货排名, 份额条形图, 竞争监测表]
    insight:
      - Omdia 口径宇树出货 5511 台、份额 37.54%，智元 5168 台、份额 35.21%
      - 前两名份额差距仅 2.33 个百分点，领先幅度不足以支持永久垄断假设
      - 优必选、乐聚、众擎及海外厂商仍可从工业场景和模型能力改变竞争位置
    footnotes: 出货份额为 Omdia 与招股书采用口径，其他机构排名可能不同
    source: 太平洋证券；招股说明书；Omdia
  - page: 10
    message: 人形工业商业化仍处早期
    title: 人形科研教育收入占 73.6%，工业场景尚处 9.0% 验证期
    subtitle: 科研采购提供品牌和开发生态，重复工业订单才决定人形业务的长期收入质量
    exhibits: [人形应用结构, 四足应用结构, 商业化阶梯]
    insight:
      - 2025Q1—Q3 人形科研教育、商业消费、行业应用收入占比分别为 73.6%、17.4%、9.0%
      - 四足行业应用占比已达 26.1%，证明公司具备向行业客户延伸的基础
      - 投委会应优先跟踪人形行业应用占比和重复采购，而非仅跟踪总出货量
    footnotes: 应用结构为 2025 年 1—9 月收入口径，三季报未更新该拆分
    source: 招股问询回复；东吴证券；浙商证券研究摘要
  - page: 12
    message: 降价未破坏硬件盈利
    title: 人形均价两年降 72.0% 而毛利率守住 63.2%，成本优势已被验证
    subtitle: 产品结构下移与工艺、采购降本同时发生，销量放大吸收价格下降并保持高毛利
    exhibits: [人形量价序列, 分产品毛利率, 成本机制]
    insight:
      - 人形平均售价由 2023 年 59.34 万元降至 2025 年 16.64 万元
      - 同期销量由 5 台升至 5215 台，收入增长 8.68 亿元，量价对冲有效
      - 人形毛利率由高点回落但仍有 63.18%，全栈自研与规模效应具备财务证据
    footnotes: 均价下降包含 H1 向 G1 等产品结构变化，不能全部解释为同型号降价
    source: 招股说明书上会稿
  - page: 13
    message: 模型能力决定平台化上限
    title: 运控积累超过 10 年、模型投入仅约 2 年，大脑仍是关键短板
    subtitle: 高动态运控已产品化，通用任务模型仍需用真实场景的泛化、可靠性和安全指标验证
    exhibits: [大脑小脑本体对照, 模型时间线, 验证指标]
    insight:
      - 公司自 2024 年加强具身大模型研发，投入历史明显短于本体与运控
      - WMA、VLA、WVLA 等迭代显示方向明确，但演示结果不等于客户现场稳定性
      - 后续应披露任务成功率、人工接管率、连续工作时间和重复部署成本
    footnotes: 模型投入约 2 年按 2024 年至 2026 年近似计算
    source: 招股说明书；东吴证券；华金证券
  - page: 14
    message: 资本开支提高兑现要求
    title: 48.1% 募投投向模型研发，扩产与算力将同时抬高兑现门槛
    subtitle: 模型、产能与算力同步投入可打开平台空间，也会增加费用、折旧和商业回报压力
    exhibits: [募投结构, 制造基地规划, 物理 AI 新方向]
    insight:
      - 模型研发拟投入 20.22 亿元、占募投 48.13%，本体研发另占 26.41%
      - 制造基地规划年产 7.5 万台人形与 11.5 万台四足，产能消化依赖新增场景
      - 2026 物理 AI 大会新增自进化模型与超大算力方向，研发边界进一步扩张
    footnotes: 产能为募投规划而非当前有效产能；新方向为公司公开演讲口径
    source: 招股说明书；东吴证券；中国证券报
  - page: 16
    message: 历史增长由人形放量驱动
    title: 营收三年由 1.23 亿升至 16.99 亿，人形成为 51.8% 收入主引擎
    subtitle: 四足建立规模基础后人形快速放量，2025 年收入与扣非利润同步跃升
    exhibits: [2022—2025 营收柱图, 归母与扣非净利, 2025 收入结构]
    insight:
      - 2022—2025 年营业收入由 1.23 亿元升至 16.99 亿元，三年 CAGR 约 140%
      - 2025 年人形收入 8.68 亿元，首次超过四足成为最大业务
      - 2025 年扣非净利润 5.91 亿元，历史盈利拐点已经实现
    footnotes: CAGR 由公司披露值计算；2022 年数据来自招股书及券商整理
    source: 招股说明书；东吴证券；华金证券
  - page: 17
    message: 2025 盈利需区分会计扰动
    title: 2025 年扣非净利率达 34.8%，股份支付使归母与扣非相差 3.13 亿
    subtitle: 一次性股份支付压低归母净利润但不涉及现金流出，判断经营趋势应同时看扣非与现金流
    exhibits: [毛利率走势, 归母扣非对照, 股份支付桥]
    insight:
      - 2025 年综合毛利率 60.44%，高于可比公司披露均值 44.44%
      - 归母净利润 2.78 亿元、扣非净利润 5.91 亿元，差额约 3.13 亿元
      - 3.49 亿元股份支付计入管理费用且不构成现金流出，不能据此推断经营恶化
    footnotes: 扣非净利率按扣非净利润除以营业收入计算；可比均值来自招股书
    source: 招股说明书上会稿；东吴证券
  - page: 18
    message: 最新季度出现收入利润背离
    title: Q3 收入增 69.9% 而扣非降 17.4%，研发增量是主要利润约束
    subtitle: 三季度收入加速，但毛利率回落与研发、销售投入增加共同压缩当期利润
    exhibits: [累计与单季 KPI, 研发投入, 毛利率与费用率]
    insight:
      - 单 Q3 收入 6.65 亿元、同比增 69.93%，扣非净利润 1.05 亿元、同比降 17.42%
      - 单 Q3 研发投入 1.27 亿元、同比增 249.58%，研发费用率升至 19.10%
      - 前三季度毛利率 54.02%、同比下降 5.73 个百分点，需拆分价格、结构与成本影响
    footnotes: 三季报未披露分产品毛利率，毛利下降原因暂不能进一步归因
    source: 公司 2026 年三季报；东吴证券三季报点评
  - page: 19
    message: 营运资金占用明显上升
    title: 存货较年初增 177%、经营现金流降 54.7%，备货转化需重点核验
    subtitle: 备货与预收同步增加支持后续交付，但采购、人工和费用支出已显著压缩现金净流入
    exhibits: [存货与应收, 合同负债, 经营现金流, 现金储备]
    insight:
      - 期末存货 10.19 亿元、较年初增 177.19%，应收账款 1.43 亿元、较年初增 143.51%
      - 合同负债 2.33 亿元、较年初增 70.20%，提供部分订单与交付信号
      - 经营现金流 1.94 亿元、同比下降 54.69%；货币资金 73.54 亿元提供投入缓冲
    footnotes: 货币资金增加主要来自 IPO 募资，不应理解为经营现金流改善
    source: 公司 2026 年三季报
  - page: 20
    message: 卖方对远期假设分歧更大
    title: 4 份卖方模型 2028 年净利相差 1.8x，远期假设比近期收入更分歧
    subtitle: 各机构对 2026 年收入预测相对集中，对 2028 年四足增速、净利率与研发费用假设差异扩大
    exhibits: [四份预测对照, 东吴两版修订, 2028 估值区间]
    insight:
      - 2028 年归母净利润预测由 12.68 亿元至 22.37 亿元，高低差约 1.76x
      - 东吴最新模型将 2028 年净利由 22.37 亿元下调至 15.08 亿元，研发投算力是重要变化
      - 预测不是一致承诺，估值应同时呈现利润与退出倍数敏感性
    footnotes: 预测分别来自东吴 2026-08-09、华鑫 2026-09-19、太平洋 2026-10-19、东吴 2026-10-29
    source: 4 份机构完整研报
  - page: 22
    message: 现价隐含超额业绩要求
    title: 现价需 2028 年净利约 34—56 亿元，较主流预测高 51%—345%
    subtitle: 以 12% 要求回报折现两年，只有维持 100x—60x 退出 PE 并显著超越卖方预测才能支撑市值
    exhibits: [反向估值公式, 60x/100x 敏感性, 与卖方预测差]
    insight:
      - 当前约 2698 亿元市值在 12% 要求回报下对应 2028 年约 3384 亿元预期市值
      - 100x 退出 PE 需净利约 33.85 亿元，60x 则需约 56.41 亿元
      - 主流四份预测最高 22.37 亿元，现价仍要求显著上修或更高退出倍数
    footnotes: 反向估值为内部假设，不是目标价；未考虑分红与净现金调整
    source: Wind；4 份机构研报；团队测算
  - page: 23
    message: 乐观情景安全边际仍不足
    title: 三情景折现价值均低于现价，乐观情景也仅接近 631 元
    subtitle: 即使采用 2028 年 32.02 亿元净利与 100x 退出 PE，折现后仍略低于当前股价
    exhibits: [三情景卡, 概率加权价值, 敏感性表]
    insight:
      - 下行/基准/乐观情景每股价值约 112/265/631 元，对现价均为负向空间
      - 30%/50%/20% 主观概率下加权价值约 292 元，仅用于比较风险收益
      - 乐观情景采用媒体转述的摩根大通 2028 年 32.02 亿元净利预测，假设要求极高
    footnotes: 情景概率、退出 PE 与折现率为内部讨论假设；不是盈利预测或目标价
    source: 4 份机构研报；财新；腾讯新闻；团队测算
  - page: 24
    message: 复议必须绑定经营证据
    title: 6 项风险与 5 个催化剂同向跟踪，2027 年解禁前需看到订单质量
    subtitle: 把估值风险转成季度可观测指标，避免仅按大会、模型发布或单日股价调整判断
    exhibits: [六项风险登记册, 五个催化剂, 季度复议安排]
    insight:
      - 重点跟踪行业应用占比、重复订单、毛利率、扣非利润、现金流和存货周转
      - 2026Q4 至 2027 年关注年报、制造基地进度、模型现场指标与限售股解禁
      - 复议需要经营证据和估值安全边际同时改善，单一催化剂不足以改变建议
    footnotes: 解禁时间来自公开报道与发行锁定安排，实际以公司公告为准
    source: 公司公告；财新；团队分析
